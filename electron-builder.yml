appId: app.seeingstone.client
productName: Seeing Stone
executableName: Seeing Stone
asar: true

directories:
  output: .runtime/release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

asarUnpack:
  - dist/main/services/persistenceWorker.js
  - dist/main/services/persistenceTypes.js

extraResources:
  - from: LICENSE
    to: legal/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: dependency-licenses.json
    to: legal/dependency-licenses.json
  - from: redistribution-compliance.json
    to: legal/redistribution-compliance.json
  - from: native/redistribution-inventory.json
    to: legal/redistribution-native-inventory.json
  - from: native-licenses
    to: legal/native-licenses
    filter:
      - "**/*"
  - from: src/renderer/assets/fonts/Inter-OFL.txt
    to: legal/fonts/Inter-OFL.txt
  - from: src/renderer/assets/fonts/Spectral-OFL.txt
    to: legal/fonts/Spectral-OFL.txt
  - from: assets/mpv/NOTICE.md
    to: legal/mpv/NOTICE.md
  - from: assets/mpv/licenses
    to: legal/mpv/licenses
    filter:
      - "**/*"
  - from: libmpv-runtime.json
    to: libmpv/runtime-manifest.json
  - from: .runtime/libmpv
    to: libmpv
    filter:
      - "*.dll"
      - "*.node"
      - "mpv.exe"

afterPack: ./scripts/after-pack.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.svg
  artifactName: Seeing-Stone-Setup-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker

nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Seeing Stone
  buildUniversalInstaller: false
  packElevateHelper: false
